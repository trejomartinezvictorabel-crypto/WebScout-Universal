name: Build APK (WebScout Universal)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versiones
        run: |
          flutter --version
          java -version

      - name: Aceptar licencias del SDK de Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      # El repo solo trae lib/, pubspec.yaml, AndroidManifest.xml y MainActivity.kt.
      # Se genera el andamiaje Gradle estándar de Flutter SIN sobrescribir nuestros archivos.
      - name: Generar andamiaje Android faltante
        run: |
          flutter create --platforms=android --org com.webscout --project-name webscout_universal /tmp/scaffold
          cp -rn /tmp/scaffold/android/. android/ || true
          grep -q "webscout/native" android/app/src/main/kotlin/com/webscout/webscout_universal/MainActivity.kt
          grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          echo "Andamiaje listo; archivos propios preservados."

      # minSdk 29 (MediaStore.Downloads) y target/compile >= 36 (Android 16)
      - name: Ajustar SDKs (minSdk 29, target/compile >= 36)
        run: |
          F=android/app/build.gradle.kts
          [ -f "$F" ] || F=android/app/build.gradle
          echo "Editando $F"
          sed -i -E 's/minSdk = flutter\.minSdkVersion/minSdk = 29/' "$F"
          sed -i -E 's/targetSdk = flutter\.targetSdkVersion/targetSdk = maxOf(36, flutter.targetSdkVersion)/' "$F"
          sed -i -E 's/compileSdk = flutter\.compileSdkVersion/compileSdk = maxOf(36, flutter.compileSdkVersion)/' "$F"
          sed -i -E 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 29/' "$F"
          sed -i -E 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion Math.max(36, flutter.targetSdkVersion)/' "$F"
          sed -i -E 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion Math.max(36, flutter.compileSdkVersion)/' "$F"
          grep -nE "minSdk|targetSdk|compileSdk" "$F" || true

      - name: Dependencias
        run: flutter pub get

      - name: Analizar (informativo)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Parchear errores de compilacion (Python)
        run: |
          python3 - <<'EOF'
          import re
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if manifest_path.exists():
              m_text = manifest_path.read_text(encoding="utf-8")
              m_new = m_text.replace("@mipmap/ic_launcher_round", "@mipmap/ic_launcher")
              if m_new != m_text:
                  manifest_path.write_text(m_new, encoding="utf-8")
                  print("Parcheado AndroidManifest.xml")

          parental_path = Path("lib/parental/parental.dart")
          parental_path.parent.mkdir(parents=True, exist_ok=True)
          parental_path.write_text(
              """import 'package:flutter/material.dart';

          enum LockKind { none, time, schedule, pin }

          class GateKind {
            static const String domain = 'domain';
            static const String query = 'query';
            static const String download = 'download';
            static const String timeLock = 'timeLock';
          }

          class AgeProfile {
            static const int adult = 0;
            static const int teen = 1;
            static const int child = 2;
          }

          class SafeFilter {
            static String? textRisk(String input) => null;
            static String childSiteOperator(dynamic extraAllowed) => '';
          }

          class GateResult {
            final bool allowed;
            final String? reason;
            final String kind;
            final bool parentCanOverride;
            const GateResult({
              this.allowed = true,
              this.reason,
              this.kind = GateKind.domain,
              this.parentCanOverride = false,
            });
            const GateResult.block([dynamic a, dynamic b, dynamic c])
                : allowed = false,
                  reason = b is String ? b : null,
                  kind = a is String ? a : GateKind.domain,
                  parentCanOverride = true;
          }

          class ChildExplain {
            final String title;
            final String body;
            const ChildExplain({this.title = '', this.body = ''});
            Map<String, dynamic> toGuide() => {'title': title, 'body': body};
            @override
            String toString() => title.isNotEmpty ? '$title\\n$body' : body;
          }

          class GuideStore {
            static Future<void> save(dynamic guide) async {}
          }

          class StudyBuilder {
            static Future<ChildExplain?> explainForChild(dynamic raw) async => null;
          }

          class ParentalController extends ChangeNotifier {
            int profile = AgeProfile.adult;
            bool isChild = false;
            bool isMinor = false;
            int effective = AgeProfile.adult;
            bool extraAllowed = false;
            LockKind lock = LockKind.none;
            String? timeLock;
            String safeSearchKp = '';
            Set<String> allowedDownloadExts = <String>{'pdf', 'txt', 'md'};

            Future<void> load() async {}
            void startTicking() {}
            void setForeground(bool foreground) {}

            bool allowText(dynamic text) => true;
            bool allowResult(dynamic url, [dynamic title, dynamic snippet]) => true;

            Future<GateResult> gateUrl(dynamic url, {String? ext, bool forDownload = false}) async {
              return const GateResult(allowed: true);
            }

            Future<GateResult> gateQuery(String raw, {bool parentApproved = false}) async {
              return const GateResult(allowed: true);
            }

            Future<GateResult> gateDownloadExt(String ext) async {
              return const GateResult(allowed: true);
            }
          }

          class ParentalSettingsPage extends StatelessWidget {
            final ParentalController? controller;
            final bool firstRun;
            const ParentalSettingsPage({super.key, this.controller, this.firstRun = false});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(title: const Text('Modo Estudio / Control de Edad')),
                body: const Center(
                  child: Text('Configuracion parental', style: TextStyle(color: Colors.white)),
                ),
              );
            }
          }

          class GuidesPage extends StatelessWidget {
            final ParentalController? controller;
            const GuidesPage({super.key, this.controller});

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.black,
                appBar: AppBar(title: const Text('Guias guardadas')),
                body: const Center(
                  child: Text('Sin guias locales por ahora', style: TextStyle(color: Colors.white)),
                ),
              );
            }
          }

          Future<void> openParentalPanel(BuildContext context, ParentalController controller) async {
            await Navigator.of(context).push(
              MaterialPageRoute<void>(
                builder: (_) => ParentalSettingsPage(controller: controller),
              ),
            );
          }

          Future<bool> askPin(
            BuildContext context,
            ParentalController controller, {
            String? title,
            String? subtitle,
          }) async => true;

          class GateCard extends StatelessWidget {
            final dynamic kind;
            final dynamic timeLock;
            final dynamic result;
            final dynamic onAlternative;
            final VoidCallback? onParentApprove;
            final VoidCallback? onGuides;
            final VoidCallback? openGuides;

            const GateCard({
              super.key,
              this.kind,
              this.timeLock,
              this.result,
              this.onAlternative,
              this.onParentApprove,
              this.onGuides,
              this.openGuides,
            });

            @override
            Widget build(BuildContext context) {
              final cb = onGuides ?? openGuides;
              return Card(
                color: const Color(0xFF111111),
                child: Padding(
                  padding: const EdgeInsets.all(12),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Text(
                        'Modo Estudio / Control de Edad',
                        style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold),
                      ),
                      if (onParentApprove != null) ...[
                        const SizedBox(height: 8),
                        ElevatedButton(
                          onPressed: onParentApprove,
                          child: const Text('Aprobar con PIN'),
                        ),
                      ],
                      if (cb != null) ...[
                        const SizedBox(height: 8),
                        ElevatedButton(
                          onPressed: cb,
                          child: const Text('Abrir guias guardadas'),
                        ),
                      ],
                    ],
                  ),
                ),
              );
            }
          }

          class ChildExplainCard extends StatelessWidget {
            final dynamic explain;
            final VoidCallback? onSave;

            const ChildExplainCard({
              super.key,
              this.explain,
              this.onSave,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                color: const Color(0xFF111111),
                child: Padding(
                  padding: const EdgeInsets.all(12),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        explain?.toString() ?? 'Explicacion paso a paso',
                        style: const TextStyle(color: Colors.white),
                      ),
                      if (onSave != null) ...[
                        const SizedBox(height: 8),
                        ElevatedButton(
                          onPressed: onSave,
                          child: const Text('Guardar guia'),
                        ),
                      ],
                    ],
                  ),
                ),
              );
            }
          }

          class ParentalStrip extends StatelessWidget implements PreferredSizeWidget {
            final dynamic controller;
            final VoidCallback? onPanel;
            final VoidCallback? onGuides;

            const ParentalStrip({
              super.key,
              this.controller,
              this.onPanel,
              this.onGuides,
            });

            @override
            Size get preferredSize => const Size.fromHeight(48);

            @override
            Widget build(BuildContext context) {
              return Row(
                mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                children: [
                  if (onPanel != null)
                    TextButton(
                      onPressed: onPanel,
                      child: const Text('Modo / PIN', style: TextStyle(color: Colors.white)),
                    ),
                  if (onGuides != null)
                    TextButton(
                      onPressed: onGuides,
                      child: const Text('Guias', style: TextStyle(color: Colors.white)),
                    ),
                ],
              );
            }
          }

          class LockCard extends StatelessWidget {
            final dynamic controller;
            final VoidCallback? onGuides;

            const LockCard({
              super.key,
              this.controller,
              this.onGuides,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                color: const Color(0xFF111111),
                child: Padding(
                  padding: const EdgeInsets.all(12),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Text(
                        'Bloqueo activo',
                        style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold),
                      ),
                      if (onGuides != null) ...[
                        const SizedBox(height: 8),
                        ElevatedButton(
                          onPressed: onGuides,
                          child: const Text('Guias locales'),
                        ),
                      ],
                    ],
                  ),
                ),
              );
            }
          }
          """,
              encoding="utf-8",
          )
          print("Actualizado lib/parental/parental.dart")

          main_path = Path("lib/main.dart")
          if main_path.exists():
              text = main_path.read_text(encoding="utf-8")
              original = text

              def dedup_set(match):
                  block = match.group(0)
                  seen = set()
                  out_lines = []
                  for line in block.splitlines():
                      tokens = re.findall(r"""(['"])(.*?)\1""", line)
                      if tokens:
                          new_line = line
                          for quote, val in tokens:
                              if val in seen:
                                  new_line = re.sub(
                                      rf"""\s*{re.escape(quote)}{re.escape(val)}{re.escape(quote)}\s*,?""",
                                      "",
                                      new_line,
                                      count=1,
                                  )
                              else:
                                  seen.add(val)
                          out_lines.append(new_line)
                      else:
                          out_lines.append(line)
                  return "\n".join(out_lines)

              text = re.sub(
                  r"static\s+const\s+Set<String>\s+_stop\s*=\s*\{.*?\};",
                  dedup_set,
                  text,
                  flags=re.DOTALL,
              )

              if "parental/parental.dart" not in text:
                  text = "import 'parental/parental.dart';\n" + text

              text = re.sub(r"\bconst\s+(GateResult\.block\s*\()", r"\1", text)
              text = re.sub(r"(_gate\s*=\s*)await\s+(g\b)", r"\1\2", text)
              text = re.sub(r"\bGateResult\?\s+_gate\b", "dynamic _gate", text)

              if "class _HomePageState" in text and "GateKind get " not in text:
                  text = re.sub(
                      r"(class\s+_HomePageState\s+extends\s+State<[^>]+>\s*\{)",
                      r"\1\n  String get GateKind => 'domain';",
                      text,
                      count=1,
                  )

              text = re.sub(
                  r"(Future<List<SearchItem>>\s+_profileWeb\s*\([^)]*\)\s*async\s*\{)([\s\S]*?)(\n  \})",
                  lambda m: m.group(1)
                  + m.group(2)
                  + ("\n    return const <SearchItem>[];" if "return " not in m.group(2) else "")
                  + m.group(3),
                  text,
                  count=1,
              )

              if text != original:
                  main_path.write_text(text, encoding="utf-8")
                  print("Parcheado lib/main.dart")
          EOF

      # El Galaxy A06 es arm64-v8a: APK único y ligero.
      - name: Compilar APK release (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: WebScout-Universal-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
