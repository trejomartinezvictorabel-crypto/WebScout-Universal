name: Build APK (WebScout Universal)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versiones
        run: |
          flutter --version
          java -version

      - name: Aceptar licencias del SDK de Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      # El repo solo trae lib/, pubspec.yaml, AndroidManifest.xml y MainActivity.kt.
      # Se genera el andamiaje Gradle estándar de Flutter SIN sobrescribir nuestros archivos.
      - name: Generar andamiaje Android faltante
        run: |
          flutter create --platforms=android --org com.webscout --project-name webscout_universal /tmp/scaffold
          cp -rn /tmp/scaffold/android/. android/ || true
          grep -q "webscout/native" android/app/src/main/kotlin/com/webscout/webscout_universal/MainActivity.kt
          grep -q "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
          echo "Andamiaje listo; archivos propios preservados."

      # minSdk 29 (MediaStore.Downloads) y target/compile >= 36 (Android 16)
      - name: Ajustar SDKs (minSdk 29, target/compile >= 36)
        run: |
          F=android/app/build.gradle.kts
          [ -f "$F" ] || F=android/app/build.gradle
          echo "Editando $F"
          sed -i -E 's/minSdk = flutter\.minSdkVersion/minSdk = 29/' "$F"
          sed -i -E 's/targetSdk = flutter\.targetSdkVersion/targetSdk = maxOf(36, flutter.targetSdkVersion)/' "$F"
          sed -i -E 's/compileSdk = flutter\.compileSdkVersion/compileSdk = maxOf(36, flutter.compileSdkVersion)/' "$F"
          sed -i -E 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 29/' "$F"
          sed -i -E 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion Math.max(36, flutter.targetSdkVersion)/' "$F"
          sed -i -E 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion Math.max(36, flutter.compileSdkVersion)/' "$F"
          grep -nE "minSdk|targetSdk|compileSdk" "$F" || true

      - name: Dependencias
        run: flutter pub get

      - name: Analizar (informativo)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Parchear errores de compilacion (Python)
        run: |
          python3 - <<'EOF'
          import re
          from pathlib import Path

          # 1. AndroidManifest.xml: evitar fallo por @mipmap/ic_launcher_round inexistente
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if manifest_path.exists():
              m_text = manifest_path.read_text(encoding="utf-8")
              m_new = m_text.replace("@mipmap/ic_launcher_round", "@mipmap/ic_launcher")
              if m_new != m_text:
                  manifest_path.write_text(m_new, encoding="utf-8")
                  print("Parcheado AndroidManifest.xml: ic_launcher_round -> ic_launcher")

          # 2. lib/main.dart: eliminar 'donde' duplicado y definir GateCard / ChildExplainCard si faltan
          main_path = Path("lib/main.dart")
          if main_path.exists():
              text = main_path.read_text(encoding="utf-8")
              original = text

              def dedup_set(match):
                  block = match.group(0)
                  seen = set()
                  out_lines = []
                  for line in block.splitlines():
                      tokens = re.findall(r"""(['"])(.*?)\1""", line)
                      if tokens:
                          new_line = line
                          for quote, val in tokens:
                              if val in seen:
                                  # Elimina la ocurrencia duplicada junto con su coma opcional
                                  new_line = re.sub(
                                      rf"""\s*{re.escape(quote)}{re.escape(val)}{re.escape(quote)}\s*,?""",
                                      "",
                                      new_line,
                                      count=1,
                                  )
                              else:
                                  seen.add(val)
                          out_lines.append(new_line)
                      else:
                          out_lines.append(line)
                  return "\n".join(out_lines)

              text = re.sub(
                  r"static\s+const\s+Set<String>\s+_stop\s*=\s*\{.*?\};",
                  dedup_set,
                  text,
                  flags=re.DOTALL,
              )

              if "class GateCard" not in text and "Widget GateCard" not in text:
                  text += """

          class GateCard extends StatelessWidget {
            final dynamic kind;
            final dynamic timeLock;
            final VoidCallback? openGuides;

            const GateCard({
              super.key,
              this.kind,
              this.timeLock,
              this.openGuides,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                color: const Color(0xFF111111),
                child: Padding(
                  padding: const EdgeInsets.all(12),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Text(
                        'Modo Estudio / Control de Edad',
                        style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold),
                      ),
                      if (openGuides != null) ...[
                        const SizedBox(height: 8),
                        ElevatedButton(
                          onPressed: openGuides,
                          child: const Text('Abrir guias guardadas'),
                        ),
                      ],
                    ],
                  ),
                ),
              );
            }
          }
          """

              if "class ChildExplainCard" not in text and "Widget ChildExplainCard" not in text:
                  text += """

          class ChildExplainCard extends StatelessWidget {
            final dynamic explain;
            final VoidCallback? onSave;

            const ChildExplainCard({
              super.key,
              this.explain,
              this.onSave,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                color: const Color(0xFF111111),
                child: Padding(
                  padding: const EdgeInsets.all(12),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        explain?.toString() ?? 'Explicacion paso a paso',
                        style: const TextStyle(color: Colors.white),
                      ),
                      if (onSave != null) ...[
                        const SizedBox(height: 8),
                        ElevatedButton(
                          onPressed: onSave,
                          child: const Text('Guardar guia'),
                        ),
                      ],
                    ],
                  ),
                ),
              );
            }
          }
          """

              if text != original:
                  main_path.write_text(text, encoding="utf-8")
                  print("Parcheado lib/main.dart correctamente")
          EOF

      # El Galaxy A06 es arm64-v8a: APK único y ligero.
      - name: Compilar APK release (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: WebScout-Universal-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
